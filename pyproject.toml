[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockiq"
version = "1.0.0"
description = "AI-Powered Stock Analysis Platform for Pakistan Stock Exchange"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "StockIQ Team", email = "team@stockiq.pk"},
]
keywords = ["stock", "analysis", "pakistan", "psx", "ai", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "sqlalchemy==2.0.23",
    "supabase==2.0.0",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "lxml==4.9.3",
    "playwright==1.40.0",
    "selenium==4.15.2",
    "scrapy==2.11.0",
    "pdfplumber==0.10.3",
    "PyPDF2==3.0.1",
    "yfinance==0.2.33",
    "google-generativeai==0.3.2",
    "openai==1.3.0",
    "redis==5.0.1",
    "upstash-redis==0.3.0",
    "click==8.1.7",
    "tqdm==4.66.1",
    "loguru==0.7.2",
    "tenacity==8.2.3",
    "prometheus-client==0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "pylint==3.0.3",
    "mypy==1.7.0",
    "isort==5.12.0",
    "pre-commit==3.5.0",
    "sphinx==7.2.6",
    "sphinx-rtd-theme==2.0.0",
    "ipython==8.17.2",
    "jupyter==1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/stockiq"
Documentation = "https://stockiq.readthedocs.io"
Repository = "https://github.com/yourusername/stockiq.git"
"Bug Tracker" = "https://github.com/yourusername/stockiq/issues"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
